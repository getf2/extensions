# Each pull request's extensions checked (tools/check.mjs), on a Mac (for
# SF Symbols' names): whose they are, their manifests, files, types, and
# their commands run as F2 runs them.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bun tools/check.mjs --changed "origin/$BASE" --author "$AUTHOR" --association "$ASSOCIATION"
          else
            bun tools/check.mjs
          fi
